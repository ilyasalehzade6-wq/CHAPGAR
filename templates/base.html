<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<title>موتور چاپ — Print Engine</title>
<script>
    document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = { 
        darkMode: 'class',
        theme: { 
            extend: { 
                fontFamily: { 
                    sans: ['Vazirmatn', 'Inter', 'sans-serif'],
                    mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                },
                colors: { 
                    vite: { purple: '#646cff', dark: '#1a1a24' },
                    vue: { green: '#42b883', dark: '#1b2a23' },
                    surface: '#242424'
                }
            } 
        }
    }
</script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Vazirmatn', sans-serif; -webkit-font-smoothing: antialiased; background-color: #121212; }
    
    /* Background Glow */
    .bg-glow { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 400px; background: radial-gradient(circle, rgba(100,108,255,0.15) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    
    /* Smooth Transitions */
    * { transition-property: background-color, border-color, color, fill, stroke, opacity, box-shadow, transform; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
    
    /* Toast */
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-enter { animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a24; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #646cff; }
</style>
</head>
<body class="text-gray-200 min-h-screen relative overflow-x-hidden">

<!-- Background Glow -->
<div class="bg-glow"></div>

<!-- Navbar (Glassmorphism) -->
<nav class="sticky top-0 z-40 bg-[#121212]/80 backdrop-blur-xl border-b border-white/10 h-16 flex items-center justify-between px-6">
  <div class="flex items-center gap-6">
    <a href="/" class="text-xl font-bold flex items-center gap-2 group">
        <span class="bg-gradient-to-r from-vite-purple to-vue-green bg-clip-text text-transparent group-hover:opacity-80 transition-opacity">موتور چاپ</span>
        <span class="text-[10px] font-mono bg-white/5 border border-white/10 px-2 py-0.5 rounded-full text-gray-400">v2.2.0</span>
    </a>
    <div class="h-5 w-px bg-white/10"></div>
    <a href="/" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">داشبورد</a>
  </div>
  <div class="flex items-center gap-4">
    <div class="flex items-center gap-2 text-xs font-mono text-vue-green bg-vue-green/10 px-3 py-1.5 rounded-full border border-vue-green/20">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-vue-green opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-vue-green"></span>
        </span>
        آماده به کار
    </div>
  </div>
</nav>

<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3"></div>

<div id="flash-data" class="hidden">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <span data-category="{{ cat }}" data-msg="{{ msg }}"></span>
    {% endfor %}
  {% endwith %}
</div>

<main class="max-w-6xl mx-auto px-6 py-12 relative z-10">
  {% block content %}{% endblock %}
</main>

<script>
    function showFloatingToast(message, isError = false) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast-enter flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl border backdrop-blur-md text-sm font-medium
            ${isError ? 'bg-red-500/10 text-red-400 border-red-500/30' : 'bg-vue-green/10 text-vue-green border-vue-green/30'}`;
        
        const icon = isError 
            ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
            : '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>';
            
        toast.innerHTML = `${icon} <span>${message}</span>`;
        container.appendChild(toast);

        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(20px)';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('#flash-data span').forEach((el, index) => {
            const isError = el.getAttribute('data-category') === 'error';
            setTimeout(() => showFloatingToast(el.getAttribute('data-msg'), isError), index * 300);
        });
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
